<script>
(() => {
  'use strict';
  const $ = selector => document.querySelector(selector);
  const $$ = selector => [...document.querySelectorAll(selector)];
  const views = ['loadingView', 'errorView', 'loginView', 'masterView', 'teacherView', 'studentView'];
  const roleLabels = { master: '마스터', teacher: '담임교사', student: '학생' };
  const AUTH_TOKEN_KEY = 'classRoutine.onlineAuthToken';
  let appData = null;
  let serverOffset = 0;
  let pollTimer = null;
  let toastTimer = null;
  let editorSessionId = '';
  let serviceEditorClassId = '';
  let preferencesEditorKey = '';
  let scheduleWeekStart = '';
  let scheduleClassId = '';
  let renderedPlanKey = '';
  let weekPlanDirty = false;
  let subjectEditorId = '';
  let routineEditorId = '';
  let pendingDesktopBackup = null;
  let dismissedTimerId = '';
  let loginChallengeId = '';
  let alertAudioContext = null;
  let alertOscillators = [];
  let activeScheduleAlertKey = '';
  let selectedRecordRoutineId = '';
  let seatingDraft = null;
  let seatingRevision = -1;
  let seatingSaving = false;
  let selectedSeatId = '';
  let selectedRoutineHistory = null;
  let dutyDraft = null;
  let dutyUpdatedAt = '';
  let dutyDirty = false;
  let pendingSchoolTimetable = null;

  function unlockAlertAudio() {
    try {
      alertAudioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      if (alertAudioContext.state === 'suspended') alertAudioContext.resume().catch(() => {});
    } catch (_) { /* The visual alert still works when audio is unavailable. */ }
  }

  function stopAlertSound() {
    alertOscillators.forEach(oscillator => { try { oscillator.stop(); } catch (_) {} });
    alertOscillators = [];
  }

  function playAlertSound(style, volume, force = false) {
    unlockAlertAudio();
    stopAlertSound();
    if (!alertAudioContext || alertAudioContext.state !== 'running') return;
    const preferences = appData && appData.preferences || {};
    style ||= preferences.globalSound || 'chime';
    volume = Math.max(0, Math.min(150, Number(volume == null ? preferences.soundVolume ?? 100 : volume)));
    if (style === 'none' || (!force && preferences.sound === false)) return;
    const patterns = {
      chime: { wave:'sine', notes:[[523,0],[659,.16],[784,.34]], level:.22, release:.7 },
      wood: { wave:'triangle', notes:[[240,0],[180,.18]], level:.3, release:.22 },
      sparkle: { wave:'sine', notes:[[659,0],[880,.12],[1047,.25],[1319,.39]], level:.22, release:.7 }
    };
    const pattern = patterns[style] || patterns.chime;
    const release = pattern.release * 3;
    const audible = Math.max(...pattern.notes.map(([, delay]) => delay + release));
    const start = alertAudioContext.currentTime + .03;
    for (let repeat = 0; repeat < 3; repeat += 1) {
      pattern.notes.forEach(([frequency, delay]) => {
        const oscillator = alertAudioContext.createOscillator();
        const gain = alertAudioContext.createGain();
        const at = start + repeat * audible * 2 + delay;
        oscillator.type = pattern.wave; oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001, at);
        gain.gain.exponentialRampToValueAtTime(Math.max(.0002, pattern.level * volume / 100), at + .04);
        gain.gain.exponentialRampToValueAtTime(.0001, at + release);
        oscillator.connect(gain).connect(alertAudioContext.destination);
        oscillator.start(at); oscillator.stop(at + release + .04);
        alertOscillators.push(oscillator);
      });
    }
  }

  function updateScheduleAlert() {
    const layer = $('#scheduleAlertLayer');
    if (!appData || !['teacher', 'student'].includes(appData.view) || document.hidden) return;
    const now = Date.now() + serverOffset;
    const date = new Date(now);
    const dateKey = new Intl.DateTimeFormat('sv-SE', { timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit' }).format(date);
    const timeText = new Intl.DateTimeFormat('ko-KR', { timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).format(date);
    if (!layer.hidden) {
      const startAt = Number(layer.dataset.startAt);
      $('#scheduleAlertNow').textContent = timeText;
      if (layer.dataset.manual === 'true') return;
      const seconds = Math.max(0, Math.ceil((startAt - now) / 1000));
      $('#scheduleAlertRemaining').textContent = seconds ? `${Math.floor(seconds / 60)}분 ${String(seconds % 60).padStart(2, '0')}초 남음` : '일정 시작!';
      return;
    }
    for (const item of appData.todaySchedule || []) {
      const startAt = Date.parse(`${dateKey}T${item.startTime}:00+09:00`);
      if (!Number.isFinite(startAt)) continue;
      const advance = item.preAlertMinutes == null ? null : Math.max(0, Number(item.preAlertMinutes) || 0);
      const notices = advance ? [{ phase:'pre', at:startAt - advance * 60000 }, { phase:'start', at:startAt }] : [{ phase:'start', at:startAt }];
      for (const notice of notices) {
        if (now < notice.at || now >= notice.at + 60000 || (notice.phase === 'pre' && now >= startAt)) continue;
        const key = `${dateKey}|${appData.classId}|${item.id}|${item.startTime}|${notice.phase}`;
        const storageKey = `classRoutine.scheduleAlert.${key}`;
        if (sessionStorage.getItem(storageKey)) continue;
        sessionStorage.setItem(storageKey, 'seen');
        activeScheduleAlertKey = key;
        layer.dataset.startAt = String(startAt);
        layer.dataset.manual = 'false';
        $('#scheduleAlertPhase').textContent = notice.phase === 'pre' ? '곧 시작할 일정' : '지금 시작할 일정';
        $('#scheduleAlertStart').textContent = item.startTime;
        $('#scheduleAlertTitle').textContent = item.title || '일정 안내';
        $('#scheduleAlertMessage').textContent = item.message || `${item.category || '다음 일정'}을 확인해 주세요.`;
        showAlertMeal(/점심|급식/.test(`${item.title} ${item.category}`));
        $('#scheduleAlertHandoff').hidden = !item.handoffMessage;
        $('#scheduleAlertHandoff').textContent = item.handoffMessage ? `이전 수업 메모 · ${item.handoffMessage}` : '';
        $('#scheduleAlertTeacherNote').hidden = !item.teacherNote;
        $('#scheduleAlertTeacherNote').textContent = item.teacherNote ? `교사 메모 · ${item.teacherNote}` : '';
        const resource = $('#scheduleAlertResource');
        resource.hidden = !item.resourceUrl;
        if (item.resourceUrl) { resource.href = item.resourceUrl; resource.textContent = `${item.resourceLabel || '자료 열기'} ↗`; }
        layer.hidden = false;
        updateScheduleAlert();
        playAlertSound();
        $('#confirmScheduleAlert').focus();
        return;
      }
    }
  }

  function showAlertMeal(visible) {
    const target = $('#scheduleAlertMeal');
    const meal = appData && appData.dailyInfo && appData.dailyInfo.meal;
    if (!visible || !meal || meal.status !== 'ready') { target.hidden = true; target.textContent = ''; return; }
    const menu = (meal.dishes || []).map(dish => dish.name).join(' · ');
    const warnings = appData.view === 'teacher'
      ? (meal.warningStudents || []).map(student => `${student.number || ''}번 ${student.name}: ${student.dishes.join('·')}`)
      : (meal.warningDishes || []).map(dish => `${dish.name}: ${dish.matchedNames.join('·')}`);
    target.textContent = `오늘 메뉴 · ${menu || '학교 식단표 확인'}${warnings.length ? `\n알레르기 주의 · ${warnings.join(' / ')}\n배식 전 학교 식단표와 관리 지침을 다시 확인하세요.` : ''}`;
    target.hidden = false;
  }

  function openManualMeal() {
    const layer = $('#scheduleAlertLayer');
    stopAlertSound();
    layer.dataset.manual = 'true';
    layer.dataset.startAt = String(Date.now() + serverOffset);
    $('#scheduleAlertPhase').textContent = '오늘의 급식';
    $('#scheduleAlertStart').textContent = '—';
    $('#scheduleAlertTitle').textContent = appData.dailyInfo && appData.dailyInfo.meal && appData.dailyInfo.meal.mealName || '오늘 급식';
    $('#scheduleAlertMessage').textContent = '오늘 메뉴와 알레르기 주의 내용을 확인하세요.';
    $('#scheduleAlertHandoff').hidden = true;
    $('#scheduleAlertTeacherNote').hidden = true;
    $('#scheduleAlertResource').hidden = true;
    $('#scheduleAlertRemaining').textContent = '맛있게 드세요';
    showAlertMeal(true);
    layer.hidden = false;
    updateScheduleAlert();
    $('#confirmScheduleAlert').focus();
  }

  function showView(id) {
    views.forEach(viewId => { $('#' + viewId).hidden = viewId !== id; });
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
  }

  function toast(message) {
    const element = $('#toast');
    element.textContent = message;
    element.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => element.classList.remove('show'), 2600);
  }

  function errorText(error) {
    return String(error && error.message || error || '요청을 처리하지 못했습니다.').replace(/^Exception:\s*/, '');
  }

  function callServer(method, payload) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      const request = Object.assign({}, payload || {});
      const authToken = sessionStorage.getItem(AUTH_TOKEN_KEY);
      if (authToken) request._authToken = authToken;
      runner[method](request);
    });
  }

  function setBusy(element, busy, label) {
    if (!element) return;
    if (busy) {
      element.dataset.labelHtml = element.innerHTML;
      element.textContent = label || '처리 중…';
      element.disabled = true;
    } else {
      element.innerHTML = element.dataset.labelHtml || element.innerHTML;
      element.disabled = false;
    }
  }

  function renderIdentity(actor) {
    $('#identity').hidden = false;
    $('#roleChip').textContent = roleLabels[actor.role] || actor.role;
    $('#identityName').textContent = actor.name || roleLabels[actor.role] || '';
    $('#identityEmail').textContent = actor.email || '';
    $('#logoutButton').hidden = !sessionStorage.getItem(AUTH_TOKEN_KEY);
  }

  function applyData(data) {
    data = Object.assign({}, appData || {}, data || {});
    data.actor = data.actor || (appData && appData.actor);
    appData = data;
    if (data.serverTime) serverOffset = Date.parse(data.serverTime) - Date.now();
    renderIdentity(data.actor);
    if (data.view === 'master') renderMaster(data);
    else if (data.view === 'teacher') renderTeacher(data);
    else if (data.view === 'student') renderStudent(data);
    schedulePolling();
  }

  async function initialize() {
    clearTimeout(pollTimer);
    showView('loadingView');
    try { applyData(await callServer('getBootstrap')); }
    catch (error) {
      $('#identity').hidden = true;
      const message = errorText(error);
      if (message.includes('LOGIN_REQUIRED')) {
        sessionStorage.removeItem(AUTH_TOKEN_KEY);
        $('#loginStatus').textContent = message.replace(/^.*LOGIN_REQUIRED:\s*/, '');
        showView('loginView');
      } else {
        $('#errorMessage').textContent = message;
        showView('errorView');
      }
    }
  }

  function renderMaster(data) {
    showView('masterView');
    $('#schoolDomain').textContent = data.schoolDomain ? '@' + data.schoolDomain : '도메인 미설정';
    $('#classCount').textContent = data.classes.length;
    $('#classList').innerHTML = data.classes.length ? data.classes.map(item => `
      <article class="class-item">
        <small>${escapeHtml(item.schoolName || '학교')}</small>
        <b>${escapeHtml(item.className)}</b>
        <span>${escapeHtml(item.teacherName)} · ${escapeHtml(item.teacherEmail)}</span>
        <em>학생 ${Number(item.studentCount) || 0}명 연결</em>
        <button type="button" data-open-class="${escapeHtml(item.classId)}">교사 화면 열기 →</button>
      </article>`).join('') : '<div class="empty-card">아직 연결된 학급이 없습니다.<br>왼쪽에서 첫 학급을 등록해 주세요.</div>';
  }

  function renderTeacher(data) {
    showView('teacherView');
    $('#teacherClassName').textContent = `${data.classroom.schoolName || ''} ${data.classroom.className || ''}`.trim();
    requestAnimationFrame(fitTeacherHeading);
    $('#masterReturnButton').hidden = data.actor.role !== 'master';
    $('#neisApiKey').closest('details').hidden = data.actor.role !== 'master';
    $('#rosterCount').textContent = `${data.roster.length}명`;
    if (scheduleClassId !== data.classId) {
      scheduleClassId = data.classId;
      scheduleWeekStart = data.selectedWeekStart || '';
      renderedPlanKey = '';
      weekPlanDirty = false;
      subjectEditorId = '';
      routineEditorId = '';
    }
    if (!scheduleWeekStart) scheduleWeekStart = data.selectedWeekStart || '';
    renderSubjectSettings(data.subjects || []);
    renderWeekPlan(data.weekPlan);
    renderRoutineEditor(data.routines || [], data.subjects || []);
    renderPreferences(data.preferences || {});
    renderSchedule(data.todaySchedule || [], 'teacher');
    renderRecordPanel(data.todaySchedule || [], data.todayRecords || []);
    renderSeating(data.seating, data.roster || []);
    renderDuty(data.dutyToday, 'teacher');
    renderDutyEditor(data.dutyBoard, data.roster || []);
    renderAnnouncement(data.announcement, 'teacher');
    renderClassTimer(data.classTimer, 'teacher');
    if (serviceEditorClassId !== data.classId) {
      serviceEditorClassId = data.classId;
      const service = data.serviceSettings || {};
      $('#neisSchoolSearch').value = data.classroom && data.classroom.schoolName || '';
      $('#neisOfficeCode').value = service.neisOfficeCode || '';
      $('#neisSchoolCode').value = service.neisSchoolCode || '';
      $('#weatherNx').value = service.weatherNx || '';
      $('#weatherNy').value = service.weatherNy || '';
      $('#neisApiKey').value = ''; $('#kmaApiKey').value = '';
      $('#neisKeyState').textContent = service.hasNeisApiKey ? '저장됨' : '미등록 · 샘플 조회';
      $('#kmaKeyState').textContent = service.hasKmaApiKey ? '저장됨' : '미등록';
    }
    renderDailyInfo(data.dailyInfo, 'teacher');
    const active = Boolean(data.state);
    $('#teacherLiveLamp').classList.toggle('active', active);
    $('#teacherLiveLamp').querySelector('b').textContent = active ? '학생 화면 게시 중' : '활동 대기';
    $('#closeSessionButton').disabled = !active;
    if (active && editorSessionId !== data.state.sessionId) {
      editorSessionId = data.state.sessionId;
      $('#sessionSubject').value = data.state.subject || '';
      $('#sessionTitle').value = data.state.title || '';
      $('#sessionMessage').value = data.state.message || '';
      $('#resourceLabel').value = data.state.resourceLabel || '';
      $('#resourceUrl').value = data.state.resourceUrl || '';
      $('#pollQuestion').value = data.state.pollQuestion || '';
      $('#pollOptions').value = (data.state.pollOptions || []).join(', ');
    }
    $('#liveTitle').textContent = active ? data.state.title : '게시된 활동이 없어요';
    $('#liveMessage').textContent = active ? (data.state.message || '학생들이 활동 화면을 보고 있어요.') : '왼쪽에서 학생 화면에 보낼 활동을 작성해 주세요.';
    $('#readyCount').textContent = data.counts.ready || 0;
    $('#readyTotal').textContent = `/ ${data.roster.length}`;
    $('#exitCount').textContent = data.counts.exit || 0;
    $('#helpCount').textContent = data.helpQueue.length;
    $('#helpBadge').textContent = `${data.helpQueue.length}명 대기`;
    renderBars($('#understandingBars'), ['잘 알아요', '조금 어려워요', '도움이 필요해요'], data.counts.understanding || {}, data.roster.length);
    renderBars($('#pollBars'), active ? data.state.pollOptions || [] : [], data.counts.poll || {}, data.roster.length);
    $('#helpList').innerHTML = data.helpQueue.length ? data.helpQueue.map(item => `
      <article class="help-item"><div><b>${escapeHtml(item.number ? item.number + '번 ' : '')}${escapeHtml(item.name)}</b><small>${escapeHtml(item.message)}</small></div><button type="button" data-resolve-help="${escapeHtml(item.requestId)}">도움 완료</button></article>
    `).join('') : '<div class="bar-empty">기다리는 학생이 없어요.</div>';
  }

  function fitTeacherHeading() {
    const title = $('#teacherClassName').parentElement;
    if (!title || title.hidden || !title.clientWidth) return;
    title.style.fontSize = '';
    const naturalSize = parseFloat(getComputedStyle(title).fontSize) || 62;
    if (title.scrollWidth <= title.clientWidth) return;
    const fittedSize = Math.max(15, Math.floor(naturalSize * title.clientWidth / title.scrollWidth * 0.98));
    title.style.fontSize = `${fittedSize}px`;
  }

  function renderSubjectSettings(subjects) {
    $('#subjectOptions').innerHTML = subjects.filter(item => item.enabled).map(item => `<option value="${escapeHtml(item.name)}"></option>`).join('');
    const select = $('#subjectSettingSelect');
    const optionsKey = subjects.map(item => `${item.subjectId}:${item.name}`).join('|');
    if (select.dataset.optionsKey !== optionsKey) {
      select.dataset.optionsKey = optionsKey;
      select.innerHTML = subjects.map(item => `<option value="${escapeHtml(item.subjectId)}">${escapeHtml(item.name)}</option>`).join('');
    }
    if (!subjectEditorId || !subjects.some(item => item.subjectId === subjectEditorId)) subjectEditorId = subjects[0] && subjects[0].subjectId || '';
    if (subjectEditorId) select.value = subjectEditorId;
    const form = $('#subjectSettingForm');
    if (!form.contains(document.activeElement)) fillSubjectEditor(subjectEditorId, subjects);
  }

  function fillSubjectEditor(subjectId, subjects = appData && appData.subjects || []) {
    const subject = subjects.find(item => item.subjectId === subjectId);
    if (!subject) return;
    subjectEditorId = subject.subjectId;
    $('#subjectSettingSelect').value = subject.subjectId;
    $('#subjectSettingName').value = subject.name || '';
    $('#subjectSettingMessage').value = subject.message || '';
    $('#subjectResourceLabel').value = subject.resourceLabel || '';
    $('#subjectResourceUrl').value = subject.resourceUrl || '';
  }

  function renderRoutineEditor(routines, subjects) {
    const select = $('#routineSelect');
    const key = routines.map(item => `${item.id}:${item.title}:${item.startTime}:${item.weekStart}`).join('|');
    if (select.dataset.optionsKey !== key) {
      select.dataset.optionsKey = key;
      select.innerHTML = '<option value="">새 일정</option>' + routines.slice().sort((a, b) => a.startTime.localeCompare(b.startTime))
        .map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.startTime)} · ${escapeHtml(item.title)}${item.weekStart ? ` (${escapeHtml(item.weekStart)} 주)` : ''}</option>`).join('');
    }
    $('#routineSubject').innerHTML = '<option value="">과목 없음</option>' + subjects.filter(item => item.enabled)
      .map(item => `<option value="${escapeHtml(item.subjectId)}">${escapeHtml(item.name)}</option>`).join('');
    if (routineEditorId && !routines.some(item => item.id === routineEditorId)) routineEditorId = '';
    select.value = routineEditorId;
    if (routineEditorId && !$('#routineForm').contains(document.activeElement)) fillRoutineEditor(routineEditorId);
    $('#deleteRoutineButton').hidden = !routineEditorId;
  }

  function renderPreferences(preferences) {
    const key = `${appData.classId}:${JSON.stringify(preferences)}`;
    if (preferencesEditorKey === key || $('#classPreferencesForm').contains(document.activeElement)) return;
    preferencesEditorKey = key;
    const messages = preferences.commonMessages || {};
    $('#commonBreakMessage').value = messages.break || '';
    $('#commonMiddleMessage').value = messages.middlePlay || '';
    $('#commonLunchMessage').value = messages.lunch || '';
    $('#globalSound').value = preferences.globalSound || 'chime';
    $('#soundVolume').value = preferences.soundVolume ?? 100;
    $('#soundEnabled').checked = preferences.sound !== false;
  }

  function fillRoutineEditor(id) {
    const routine = (appData && appData.routines || []).find(item => item.id === id);
    routineEditorId = routine ? routine.id : '';
    $('#routineSelect').value = routineEditorId;
    $('#routineStart').value = routine ? routine.startTime : '08:40';
    $('#routineDuration').value = routine ? routine.duration : 10;
    $('#routineType').value = routine ? routine.type : 'other';
    $('#routineWeekScope').value = routine && routine.weekStart ? 'week' : '';
    $('#routineWeekStart').value = routine && routine.weekStart || scheduleWeekStart;
    $('#routineWeekStartWrap').hidden = $('#routineWeekScope').value !== 'week';
    $('#routineTitle').value = routine ? routine.title : '';
    $('#routineSubject').value = routine ? routine.subjectId : '';
    $('#routineCategory').value = routine ? routine.category : '';
    $('#routinePreMode').value = routine ? routine.preAlertMode : 'default';
    $('#routinePreMinutes').value = routine ? routine.preAlertMinutes : 2;
    $('#routinePreMinutes').disabled = $('#routinePreMode').value !== 'custom';
    $('#routineMessage').value = routine ? routine.eventMessage : '';
    $$('[data-routine-day]').forEach(input => { input.checked = routine ? routine.activeDays.includes(Number(input.dataset.routineDay)) : true; });
    $('#routineEnabled').checked = routine ? routine.enabled : true;
    $('#deleteRoutineButton').hidden = !routine;
  }

  function renderWeekPlan(weekPlan) {
    if (!weekPlan || weekPlan.weekStart !== scheduleWeekStart) return;
    const key = `${weekPlan.weekStart}:${weekPlan.revision}:${weekPlan.updatedAt}`;
    if (weekPlanDirty && renderedPlanKey && renderedPlanKey !== key) {
      $('#weekPlanState').textContent = '다른 화면에서 변경됨 · 저장 전 새로고침 필요';
      $('#weekPlanState').className = 'conflict';
      return;
    }
    if (weekPlanDirty || renderedPlanKey === key) return;
    renderedPlanKey = key;
    const plan = weekPlan.plan || {}, schedule = plan.schedule || {};
    $('#planSchoolLevel').value = schedule.schoolLevel || 'elementary';
    $('#planFirstStart').value = schedule.firstStart || '09:00';
    $('#planClassMinutes').value = schedule.classMinutes || 40;
    $('#planBreakMinutes').value = schedule.breakMinutes ?? 10;
    $('#planPeriodCount').value = schedule.periodCount || 6;
    $('#planMiddleEnabled').checked = Boolean(schedule.middlePlay && schedule.middlePlay.enabled);
    $('#planMiddleAfter').value = schedule.middlePlay && schedule.middlePlay.afterPeriod || 2;
    $('#planMiddleDuration').value = schedule.middlePlay && schedule.middlePlay.duration || 20;
    $('#planLunchEnabled').checked = Boolean(schedule.lunch && schedule.lunch.enabled);
    $('#planLunchAfter').value = schedule.lunch && schedule.lunch.afterPeriod || 4;
    $('#planLunchDuration').value = schedule.lunch && schedule.lunch.duration || 50;
    $('#planDismissalEnabled').checked = Boolean(schedule.dismissal && schedule.dismissal.enabled);
    $('#planDismissalFive').value = schedule.dismissal && schedule.dismissal.afterFive || '13:50';
    $('#planDismissalSix').value = schedule.dismissal && schedule.dismissal.afterSix || '14:40';
    buildWeekPlanGrid(plan);
    const monday = new Date(`${weekPlan.weekStart}T12:00:00`), friday = new Date(monday); friday.setDate(monday.getDate() + 4);
    $('#weekPlanLabel').textContent = `${monday.toLocaleDateString('ko-KR', { month:'long', day:'numeric' })} ~ ${friday.toLocaleDateString('ko-KR', { month:'long', day:'numeric' })}`;
    $('#weekPlanState').textContent = weekPlan.revision ? `${new Date(weekPlan.updatedAt).toLocaleString('ko-KR')} 저장 · 버전 ${weekPlan.revision}` : '저장된 시간표 없음';
    $('#weekPlanState').className = '';
  }

  function buildWeekPlanGrid(plan) {
    const count = Math.max(1, Math.min(8, Number($('#planPeriodCount').value) || 6));
    const subjects = (appData.subjects || []).filter(item => item.enabled);
    const options = `<option value="">미배정</option>` + subjects.map(item => `<option value="${escapeHtml(item.subjectId)}">${escapeHtml(item.name)}</option>`).join('');
    const names = { 1:'월요일', 2:'화요일', 3:'수요일', 4:'목요일', 5:'금요일' };

  function mapSchoolTimetable(parsed) {
    const timetable = {}, missing = new Set();
    Object.entries(parsed.table || {}).forEach(([day, periods]) => {
      if (Number(day) < 1 || Number(day) > 5) return;
      Object.entries(periods).forEach(([period, name]) => {
        const subject = SchoolTimetableImport.findSubject(name, appData.subjects || []);
        if (!subject) { missing.add(name); return; }
        timetable[day] ||= {};
        timetable[day][period] = subject.subjectId;
      });
    });
    return { timetable, missing:[...missing] };
  }

  function seatSlots(layout) {

  function shuffleSeats(values) {
    const result = values.slice();
    for (let index = result.length - 1; index > 0; index -= 1) {
      const random = crypto.getRandomValues(new Uint32Array(1))[0] % (index + 1);
      [result[index], result[random]] = [result[random], result[index]];
    }
    return result;
  }

  function seatingPenalty(candidate, history, options) {
    const oldSeats = new Map(), oldPairs = new Map();
    const pairs = seats => {
      const groups = new Map();
      Object.entries(seats).forEach(([id, email]) => {
        if (!email) return;
        const [section, row, column] = id.split('-').map(Number);
        const pair = `${section}-${row}-${Math.floor(column / 2)}`;
        if (!groups.has(pair)) groups.set(pair, []);
        groups.get(pair).push(email);
      });
      const matches = new Map();
      groups.forEach(group => group.forEach(email => matches.set(email, group.filter(other => other !== email))));
      return matches;
    };
    history.forEach(entry => {
      Object.entries(entry.seats || {}).forEach(([id, email]) => {
        if (!email) return;
        if (!oldSeats.has(email)) oldSeats.set(email, new Set());
        oldSeats.get(email).add(id);
      });
      pairs(entry.seats || {}).forEach((others, email) => {
        if (!oldPairs.has(email)) oldPairs.set(email, new Set());
        others.forEach(other => oldPairs.get(email).add(other));
      });
    });
    const currentPairs = pairs(candidate.seats);
    let penalty = 0;
    Object.entries(candidate.seats).forEach(([id, email]) => {
      if (options.avoidSeats && oldSeats.get(email)?.has(id)) penalty += 5;
      if (options.avoidPairs) (currentPairs.get(email) || []).forEach(other => { if (oldPairs.get(email)?.has(other)) penalty += 3; });
    });
    return penalty;
  }

  function generateSeatCandidate(roster) {
    const layout = seatingDraft.layout;
    const pool = shuffleSeats(roster);
    const seats = {};
    shuffleSeats(seatSlots(layout)).forEach(slot => {
      const preferred = slot.column % 2 === 0 ? '여' : '남';
      let index = seatingDraft.options.mixGender ? pool.findIndex(student => student.gender === preferred) : -1;
      if (index < 0) index = pool.length ? 0 : -1;
      if (index >= 0) {
        const student = pool.splice(index, 1)[0];
        seats[slot.id] = student.seatKey || student.email;
      }
    });
    return { savedAt:new Date().toISOString(), layout:JSON.parse(JSON.stringify(layout)), seats };
  }

  function mondayKey(date = new Date()) {
    const value = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
    const offset = (value.getDay() + 6) % 7;
    value.setDate(value.getDate() - offset);
    return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, '0')}-${String(value.getDate()).padStart(2, '0')}`;
  }

  function shiftedWeek(weekStart, days) {

  $('#generateSeating').addEventListener('click', async event => {
    if (!seatingDraft || seatingSaving) return;
    const roster = appData.roster || [];
    if (!roster.length) return toast('먼저 학생 이메일 명렬을 등록해 주세요.');
    if (seatingDraft.options.mixGender && roster.some(student => !student.gender)) return toast('성별 균형을 쓰려면 모든 학생의 성별을 명렬에 입력해 주세요.');
    if (seatSlots(seatingDraft.layout).length < roster.length) return toast('좌석 수가 학생 수보다 적습니다. 교실 크기를 늘려 주세요.');
    let best = null, bestScore = Infinity;
    for (let attempt = 0; attempt < 120; attempt += 1) {
      const candidate = generateSeatCandidate(roster);
      const score = seatingPenalty(candidate, seatingDraft.history, seatingDraft.options);
      if (score < bestScore) { best = candidate; bestScore = score; }
      if (score === 0) break;
    }
    seatingDraft.current = best;
    selectedSeatId = '';
    renderSeatBoard();
    if (await persistSeating(event.currentTarget, '저장 중…')) toast(bestScore ? '새 배치를 저장했어요. 이전 자리나 짝이 일부 겹칠 수 있습니다.' : '새 배치를 저장했어요. 확인 후 확정해 주세요.');

      const [email, number, name] = parts;
      const gender = parts.length > 4 ? parts[3] : undefined;
      const allergenCodes = parts.length > 4 ? parts.slice(4).join(',') : parts[3] || '';
      return { email, number, name, gender, allergenCodes };
    });
  }

  $('#saveRosterButton').addEventListener('click', async event => {
    const entries = rosterEntriesFromInput().filter(item => item.email);
    if (!entries.length) return toast('이메일을 입력한 학생이 없습니다. 명렬 학생은 그대로 보관됩니다.');
    if (await runAction(event.currentTarget, 'saveRoster', { classId: appData.classId, entries }, '등록 중…')) toast(`${entries.length}명의 로그인 계정을 등록했어요.`);
  });

  $('#syncRosterButton').addEventListener('click', async event => {
    const entries = rosterEntriesFromInput();
    if (!entries.length) { toast('전체 명렬 동기화에는 학생을 한 명 이상 입력해 주세요.'); return; }
    if (entries.some(item => !item.email)) { toast('전체 로그인 동기화는 모든 학생 이메일을 입력한 뒤 실행해 주세요.'); return; }
    const current = (appData.roster || []).filter(student => student.active !== false);
    const incoming = new Set(entries.map(entry => String(entry.email || '').trim().toLowerCase()));
    const removed = current.filter(student => !incoming.has(String(student.email || '').trim().toLowerCase()));
    const names = removed.map(student => `${student.number || ''} ${student.name || student.email}`.trim());
    const message = removed.length
      ? `입력 명렬에서 빠진 ${removed.length}명의 로그인을 비활성화합니다. 기존 기록은 남습니다.\n\n${names.join('\n')}\n\n계속할까요?`
      : '입력 명렬을 전체 명렬로 동기화합니다. 비활성화할 학생은 없습니다. 계속할까요?';
    if (!confirm(message)) return;
    const payload = {
      classId: appData.classId, mode: 'sync', confirmDeactivation: true,
      deactivateEmails: removed.map(student => student.email), entries
    };
    if (await runAction(event.currentTarget, 'saveRoster', payload, '동기화 중…')) {
      toast(`명렬을 동기화했어요. ${removed.length}명의 로그인을 비활성화했습니다.`);
    }
  });

  $('#helpList').addEventListener('click', async event => {
    const button = event.target.closest('[data-resolve-help]');
    if (!button) return;
    if (await runAction(button, 'resolveHelp', { classId: appData.classId, requestId: button.dataset.resolveHelp }, '확인 중…')) toast('도움 요청을 완료 처리했어요.');
  });

  $('#readyButton').addEventListener('click', event => runAction(event.currentTarget, 'submitStudentResponse', { sessionId: appData.state.sessionId, type: 'ready', value: '준비 완료' }, '보내는 중…'));
  $('#understandingChoices').addEventListener('click', event => {
    const button = event.target.closest('[data-value]');
    if (button) runAction(button, 'submitStudentResponse', { sessionId: appData.state.sessionId, type: 'understanding', value: button.dataset.value }, '보내는 중…');
  });
  $('#studentPollOptions').addEventListener('click', event => {
    const button = event.target.closest('[data-poll-value]');
    if (button) runAction(button, 'submitStudentResponse', { sessionId: appData.state.sessionId, type: 'poll', value: button.dataset.pollValue }, '보내는 중…');
  });
  $('#helpButton').addEventListener('click', event => runAction(event.currentTarget, 'requestHelp', { sessionId: appData.state.sessionId, message: $('#helpMessage').value }, '요청 중…'));
  $('#cancelHelpButton').addEventListener('click', event => runAction(event.currentTarget, 'cancelHelp', { requestId: appData.helpRequest.requestId }, '취소 중…'));
  $('#exitButton').addEventListener('click', event => runAction(event.currentTarget, 'submitStudentResponse', { sessionId: appData.state.sessionId, type: 'exit', value: $('#exitText').value }, '보내는 중…'));

  $$('[data-test-schedule-sound]').forEach(button => button.addEventListener('click', () => { unlockAlertAudio(); playAlertSound(null, null, true); toast('알림음을 시험합니다. 브라우저 탭이 열려 있어야 일정 알림이 나타납니다.'); }));
  $('#testScheduleSound').addEventListener('click', () => { unlockAlertAudio(); playAlertSound(null, null, true); toast('알림음을 시험합니다. 브라우저 탭이 열려 있어야 일정 알림이 나타납니다.'); });
  $('#confirmScheduleAlert').addEventListener('click', () => {
    stopAlertSound();
    activeScheduleAlertKey = '';
    $('#scheduleAlertLayer').hidden = true;
    $('#scheduleAlertLayer').dataset.manual = 'false';
  });
  $$('[data-open-meal]').forEach(button => button.addEventListener('click', openManualMeal));

  function updateCountdown() {
    const now = Date.now() + serverOffset;
    $('#serverClock').textContent = new Date(now).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    updateClassTimer();
    updateScheduleAlert();
    if (!appData || appData.view !== 'student' || !appData.state) return;
    const countdown = $('#studentCountdown');
    if (!appData.state.endsAt) { countdown.textContent = '함께 진행'; return; }
    const seconds = Math.max(0, Math.ceil((Date.parse(appData.state.endsAt) - now) / 1000));
    countdown.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  }

  setInterval(updateCountdown, 1000);
  $('#routineHistoryDate').value = new Intl.DateTimeFormat('sv-SE', { timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
  window.addEventListener('resize', () => requestAnimationFrame(fitTeacherHeading));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshState(); });
  initialize();
})();
</script>
